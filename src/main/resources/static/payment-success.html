<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 승인 처리</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 560px; margin: 48px auto; padding: 0 20px; color: #191f28; }
    h1 { font-size: 26px; }
    #status { padding: 16px; border-radius: 8px; background: #f2f4f6; line-height: 1.55; white-space: pre-wrap; }
    #status.success { background: #e8f3ff; color: #0c5bb6; }
    #status.error { background: #fff0f0; color: #c63535; }
    a { color: #3182f6; }
  </style>
</head>
<body>
  <h1>결제를 확인하고 있습니다</h1>
  <p id="status" aria-live="polite">토스 인증 결과를 서버로 보내는 중입니다...</p>
  <p><a href="/payment.html">다른 주문 결제하기</a></p>

  <script>
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const paymentKey = params.get("paymentKey");
    const tossOrderId = params.get("orderId");
    const amount = Number(params.get("amount"));

    async function confirmPayment() {
      if (!paymentKey || !tossOrderId || !Number.isSafeInteger(amount)) {
        throw new Error("토스 결제 인증 결과(paymentKey, orderId, amount)가 올바르지 않습니다.");
      }

      const match = /^order-(\d+)-[A-Za-z0-9_-]+$/.exec(tossOrderId);
      if (!match) {
        throw new Error("주문번호 형식이 올바르지 않습니다.");
      }

      const orderDbId = match[1];
      const response = await fetch(
        `/api/v1/market/orders/${orderDbId}/payment/confirm/by/tossPayments`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentKey, orderId: tossOrderId, amount }),
        },
      );

      const result = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error(result?.msg ?? `서버 승인 요청에 실패했습니다. (HTTP ${response.status})`);
      }

      status.className = "success";
      status.textContent = result?.msg ?? "서버에 결제 승인 요청을 전달했습니다.";
    }

    confirmPayment().catch((error) => {
      status.className = "error";
      status.textContent = error?.message ?? "결제 승인 처리 중 알 수 없는 오류가 발생했습니다.";
    });
  </script>
</body>
</html>
